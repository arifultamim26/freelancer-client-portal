databases:
  - name: studio-desk-db
    databaseName: studio_desk
    user: studio_desk
    plan: basic-256mb

services:
  - type: web
    name: studio-desk
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-desk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ""
