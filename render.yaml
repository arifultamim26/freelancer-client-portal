services:
  - type: web
    name: studio-desk
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application --workers 1 --threads 2 --timeout 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_SUPERUSER_USERNAME
        value: portfolio-admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
